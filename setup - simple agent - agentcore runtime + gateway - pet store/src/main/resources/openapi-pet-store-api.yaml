openapi: 3.0.0

info:
  title: Petstore AgentCore POC
  description: Minimal Petstore API for testing Amazon Bedrock AgentCore Gateway
  version: 1.0.0

servers:
  - url: https://petstore3.swagger.io/api/v3

paths:

  /pet/findByStatus:
    get:
      operationId: findPetsByStatus
      summary: Find pets by status
      description: Returns pets matching the specified status.
      parameters:
        - name: status
          in: query
          required: true
          description: Pet status
          schema:
            type: string
            enum:
              - available
              - pending
              - sold
            default: available

      responses:
        "200":
          description: List of matching pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"

        "400":
          description: Invalid status value

  /pet/{petId}:
    get:
      operationId: getPetById
      summary: Find pet by ID
      description: Returns a single pet by its ID.
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of the pet
          schema:
            type: integer
            format: int64

      responses:
        "200":
          description: Pet found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

        "400":
          description: Invalid pet ID

        "404":
          description: Pet not found

components:
  schemas:

    Pet:
      type: object
      properties:
        id:
          type: integer
          format: int64

        name:
          type: string

        category:
          $ref: "#/components/schemas/Category"

        photoUrls:
          type: array
          items:
            type: string

        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

        status:
          type: string
          enum:
            - available
            - pending
            - sold

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string